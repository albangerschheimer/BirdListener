<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BirdListener</title>
<meta name="description" content="Reconnaître les oiseaux à leur chant, directement sur le téléphone.">
<meta name="theme-color" content="#172D23">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BirdListener">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="polices/big-shoulders.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="ouverture/oiseau.webp" as="image">
<link rel="preload" href="ouverture/logo.webp" as="image">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="ouverture" aria-hidden="true"></div>
<main>
<section id="vue-ecoute" class="vue">
  <h1>Qui chante&nbsp;?</h1>

  <section class="ecoute">
    <button id="micro" class="ecouter" aria-label="Écouter">
      <svg class="viseur" viewBox="0 0 260 260" aria-hidden="true">
        <path d="M14 70 V40 A26 26 0 0 1 40 14 H70 M190 14 H220 A26 26 0 0 1 246 40 V70 M246 190 V220 A26 26 0 0 1 220 246 H190 M70 246 H40 A26 26 0 0 1 14 220 V190"/>
      </svg>
      <svg class="progression" viewBox="0 0 260 260" aria-hidden="true"><circle cx="130" cy="130" r="92"/></svg>
      <span class="disque">
        <span class="disque-texte" id="micro-texte">Écouter</span>
        <span class="niveaux" id="niveaux" aria-hidden="true"></span>
        <span class="chrono" id="chrono"></span>
      </span>
    </button>
    <label class="lien-fichier">Importer un son<input id="fichier" type="file" accept="audio/*,video/*"></label>
  </section>

  <section id="resultat" class="resultat" hidden></section>

  <section id="carnet" class="carnet" hidden>
    <h2>Dernières écoutes</h2>
    <ol id="historique"></ol>
  </section>

  <section id="collection" class="collection" hidden>
    <h2>Mes espèces <b id="nb-especes"></b></h2>
    <ul id="mes-especes"></ul>
  </section>

  <details class="reglages">
    <summary>Réglages</summary>
    <label>Pays <select id="pays"><option value="">Partout</option></select></label>
    <label class="case"><input id="saison" type="checkbox" checked> Saison</label>
    <label class="case"><input id="partage" type="checkbox"> Partager sur la carte</label>
    <ul class="credits"><li>BirdNET, Cornell Lab et TU Chemnitz</li><li>Sons xeno-canto</li><li>Photos Wikimedia Commons</li><li>Carte OpenStreetMap</li></ul>
  </details>
</section>

<section id="vue-carte" class="vue" hidden>
  <h1 class="titre-carte">Carte</h1>
  <div class="recherche">
    <input id="filtre-espece" list="especes-carte" placeholder="Toutes les espèces" autocomplete="off" aria-label="Espèce">
    <button id="effacer-filtre" class="effacer" aria-label="Effacer" hidden>×</button>
    <datalist id="especes-carte"></datalist>
  </div>
  <div class="puces" role="group" aria-label="Filtres">
    <button class="puce actif" data-periode="0">Tout</button>
    <button class="puce" data-periode="30">30 jours</button>
    <button class="puce" data-periode="7">7 jours</button>
    <button class="puce" id="miennes" aria-pressed="false">Les miennes</button>
  </div>
  <div id="carte" class="carte"></div>
  <h2 id="autour-titre" class="classement-titre" hidden>Autour de toi</h2>
  <ol id="autour" class="classement"></ol>
  <h2 id="classement-titre" class="classement-titre" hidden>Les plus entendues ici</h2>
  <ol id="classement" class="classement"></ol>
</section>
</main>

<nav class="onglets" aria-label="Sections">
  <button class="onglet actif" data-vue="vue-ecoute">Écouter</button>
  <button class="onglet" data-vue="vue-carte">Carte</button>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<audio id="lecteur" preload="none"></audio>
<script type="module" src="ouverture.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
