# Compile le .ipa non signé de BirdListener, à télécharger dans les artefacts de l'exécution.
name: App iOS
on:
  workflow_dispatch:
  push:
    branches: [main, refonte-rouge-gorge]
    paths: ["webapp/**", "ios-app/**", ".github/workflows/ios.yml"]
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ios-app/construire.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BirdListener-ipa
          path: ios-app/BirdListener.ipa
          compression-level: 0
          retention-days: 30
